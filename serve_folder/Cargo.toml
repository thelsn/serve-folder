[package]
name = "serve_folder"
version = "1.2.0"
edition = "2021"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
walkdir = "2.3.3"
bytes = "1.5"
time = { version = "0.3", features = ["local-offset"] }
flate2 = "1.1"
crc32fast = "1.4"

[dev-dependencies]
# Independent reader used by the tests to check the archives we write
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3.8"

# Disable default TLS features
[dependencies.reqwest]
version = "0.11"
default-features = false
optional = true

[features]
default = []
