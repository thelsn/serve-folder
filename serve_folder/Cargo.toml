[package]
name = "serve_folder"
version = "0.1.0"
edition = "2021"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
tempfile = "3.8"
futures-util = "0.3"
walkdir = "2.3.3"
bytes = "1.5"
tokio-util = { version = "0.7", features = ["io"] }

# Disable default TLS features
[dependencies.reqwest]
version = "0.11"
default-features = false
optional = true

[features]
default = []
