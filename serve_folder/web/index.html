<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Server</title>
    <link rel="stylesheet" href="/webui/styles.css">
    <link rel="stylesheet" href="/webui/style.css">
    <link rel="manifest" href="/webui/manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <link rel="icon" href="/webui/icon.svg" type="image/svg+xml">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="container">
        <header>
            <h1>📁 File Server</h1>
            <div class="header-actions">
                <button id="uploadBtn" class="btn btn-primary">📤 Upload Files</button>
                <button id="stopBtn" class="btn danger">⏹ Stop Server</button>
            </div>
        </header>
        
        <main>
            <div class="breadcrumbs" id="breadcrumbs">
                <a href="#" data-path="">Root</a>
            </div>
            
            <div class="file-list" id="fileList">
                <div class="loader">Loading...</div>
            </div>
        </main>
        
        <footer>
            <p>Simple File Server with Web UI</p>
        </footer>
    </div>
    
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h2>Confirm Action</h2>
            <p>Are you sure you want to stop the server?</p>
            <div class="modal-buttons">
                <button id="confirmYes" class="btn danger">Yes, Stop Server</button>
                <button id="confirmNo" class="btn">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Upload</h2>
            <p class="upload-destination">To: <strong id="uploadDestination">🏠 Home</strong></p>
            <div class="upload-area" id="uploadArea">
                <p>📎 Drag &amp; drop files or folders here</p>
                <div class="upload-buttons">
                    <button type="button" class="btn btn-primary">Choose files</button>
                    <button type="button" class="btn" id="pickFolderBtn">Choose a folder</button>
                </div>
                <input type="file" id="fileInput" multiple style="display: none;">
                <input type="file" id="folderInput" webkitdirectory multiple style="display: none;">
            </div>
            <div id="uploadProgress" class="upload-progress" style="display: none;">
                <p class="upload-status">Uploading...</p>
                <div class="progress-container">
                    <div class="progress-bar" style="width: 0%"></div>
                </div>
                <p class="progress-text">0%</p>
            </div>
        </div>
    </div>

    <div id="dropOverlay" class="drop-overlay">
        <p>📤 Drop to upload to <strong>🏠 Home</strong></p>
    </div>

    <script src="/webui/script.js"></script>
</body>
</html>
